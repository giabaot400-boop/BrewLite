<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#704b35">
    <title>BrewLite — Đang ngoại tuyến</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #faf7f2; color: #30251e; font-family: system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; background: white; border: 1px solid #e7dfd5; border-radius: 20px; }
      .brand { color: #704b35; font-weight: 700; letter-spacing: .04em; }
      h1 { font-size: 1.7rem; line-height: 1.25; margin: 20px 0 12px; }
      p { line-height: 1.65; }
      a { display: inline-block; min-height: 44px; margin-top: 12px; padding: 12px 18px; border-radius: 12px; background: #704b35; color: white; font-weight: 600; text-decoration: none; }
      a:focus-visible { outline: 3px solid #a76c22; outline-offset: 4px; }
      @media (max-width: 400px) { main { padding: 24px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">BrewLite</p>
      <h1>Đang ngoại tuyến</h1>
      <p>Chưa kết nối được với BrewLite. Vui lòng kiểm tra mạng rồi mở lại ứng dụng.</p>
      <p>Nếu vừa gửi yêu cầu đặt hàng, kết quả có thể chưa được xác nhận. Khi có mạng, hãy kiểm tra lần đặt đó trước khi thử lại.</p>
      <a href="/">Thử mở lại BrewLite</a>
    </main>
  </body>
</html>
